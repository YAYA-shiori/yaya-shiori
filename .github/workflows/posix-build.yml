name: posix-build

# 手動実行のみ。Actions タブの "Run workflow" からブランチを選んで実行する
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux (makefile.linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build
        run: make -f makefile.linux -j"$(nproc)"

      - name: Check output
        run: |
          ls -l libaya5.so
          file libaya5.so

      - name: Check exported symbols
        run: |
          nm -D --defined-only libaya5.so | grep -E ' (load|unload|request|multi_load|multi_unload|multi_request)$'
          if nm -D --defined-only libaya5.so | grep -E ' (sqlite3_|json_|gumbo_|MD5|SHA1)'; then
            echo "internal symbols are exported"
            exit 1
          fi

      # 日本語の名前のディレクトリで、文字コードの変換とファイル操作も確かめる
      - name: Smoke test (dlopen + SHIORI load/request/unload)
        run: |
          cc -o posix_smoke tests/posix_smoke.c -ldl
          mkdir "$PWD/シェル"
          ./posix_smoke "$PWD/libaya5.so" "$PWD/シェル"

  macos:
    name: macOS (makefile.posix)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build
        run: make -k -f makefile.posix -j"$(sysctl -n hw.ncpu)"

      - name: Check output
        run: |
          ls -l libyaya.bundle
          file libyaya.bundle

      - name: Check exported symbols
        run: |
          nm -gU libyaya.bundle | grep -E ' _(load|unload|request|multi_load|multi_unload|multi_request)$'
          if nm -gU libyaya.bundle | grep -E ' _(sqlite3_|json_|gumbo_|MD5|SHA1)'; then
            echo "internal symbols are exported"
            exit 1
          fi

      # 日本語の名前のディレクトリで、文字コードの変換とファイル操作も確かめる
      - name: Smoke test (dlopen + SHIORI load/request/unload)
        run: |
          cc -o posix_smoke tests/posix_smoke.c
          mkdir "$PWD/シェル"
          ./posix_smoke "$PWD/libyaya.bundle" "$PWD/シェル"
